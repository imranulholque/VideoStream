<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>Stream to PC</h1>
  <div id="status"></div>
  <h2>This page <small>(YouTube &amp; 1000+ sites, auto-extract)</small></h2><div id="page" class="list"></div>
  <h2>Detected streams</h2><div id="videos" class="list"></div>
  <h2>Subtitles <small>(checked = used for detected streams)</small></h2><div id="subs" class="list"></div>
  <details><summary>Settings</summary>
    <label>Player
      <select id="player"><option value="mpv">mpv (recommended)</option><option value="vlc">VLC (detected streams only)</option><option value="custom">Custom exe (detected streams only)</option></select>
    </label>
    <label>Player path (optional)<input id="playerPath" placeholder="C:\Program Files\mpv\mpv.exe"></label>
    <label>Download folder<input id="downloadDir" placeholder="default: Videos\StreamToPC"></label>
    <label><input type="checkbox" id="cookiesBrowser" style="width:auto"> Use Edge cookies (login / age-restricted)</label>
    <label>cookies.txt path (optional, more reliable)<input id="cookiesFile" placeholder="C:\path\cookies.txt"></label>
  </details>
  <script src="popup.js"></script>
</body></html>
