name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name streamtopc-host host/host.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/stream-to-pc | Out-Null
          Copy-Item dist/streamtopc-host.exe dist/stream-to-pc/
          Copy-Item -Recurse extension dist/stream-to-pc/extension
          Copy-Item install.ps1, uninstall.ps1, README.md dist/stream-to-pc/
          Compress-Archive -Path dist/stream-to-pc/* -DestinationPath stream-to-pc-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with: { name: stream-to-pc-windows, path: stream-to-pc-windows.zip }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: stream-to-pc-windows.zip }
